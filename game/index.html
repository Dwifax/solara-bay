<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; font-family: Arial, sans-serif; }
#canvas { position: fixed; inset: 0; display: block; touch-action: none; }
#hud { position: fixed; inset: 0; pointer-events: none; font-size: 14px; color: #0f0; font-family: monospace; }
.hud-item { position: absolute; background: rgba(0, 20, 0, 0.8); border: 1px solid #0f0; padding: 8px; }
#minimap { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; }
#menu { position: fixed; inset: 0; display: none; background: rgba(0, 0, 0, 0.95); z-index: 1000; }
#menu.active { display: flex; align-items: center; justify-content: center; }
#menu-content { text-align: center; color: #0f0; font-size: 20px; font-family: monospace; }
.menu-button { padding: 15px 30px; margin: 15px; font-size: 16px; cursor: pointer; background: #001; color: #0f0; border: 2px solid #0f0; font-family: monospace; }
.menu-button:hover { background: #003; }
#status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud"></div>
<div id="menu"><div id="menu-content"></div></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
